name: Installable preview APK

on:
  push:
    branches: [fix/universal-recording-fallback]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcription-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        run: ./gradlew testPreviewUnitTest assemblePreview
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/preview/app-preview.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" Transcription-1.04-preview.apk
          sha256sum Transcription-1.04-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Transcription-1.04-preview
          path: |
            Transcription-1.04-preview.apk
            SHA256SUMS.txt
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/preview-notes.md <<'NOTES'
          Universal foreground recording shared by keyboard, app, notification and widget. Closing the keyboard or opening the notification shade no longer cancels capture. Live capture also belongs to the recording service.

          The saved fallback model is respected. A numeric field and slider set the primary request budget from 0 to 20 seconds. 0 uses the fallback immediately; the fallback retains its independent request limit. Upload, submission and polling share one primary deadline.

          This preview is debug-signed with a separate application ID. It installs beside the existing app without requiring the original release signing key. Open it, grant microphone access, add your API keys, and enable “Transcription Preview voice input”. The original app and its data remain installed. Unit tests and APK signature verification run before publishing. Real-device and live-provider verification is still required.
          NOTES
          TAG=preview-universal-${GITHUB_SHA::8}
          gh release create "$TAG" Transcription-1.04-preview.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Transcription 1.04 preview: universal recording and fallback fixes' --notes-file /tmp/preview-notes.md --prerelease
